# proxystack-web 的 nginx 反向代理示例。按需改 server_name、证书路径，放进 nginx 的配置目录。
# 管理服务和订阅端都提供明文 HTTP，TLS 在这里终结。管理服务默认监听 0.0.0.0，订阅端默认监听 127.0.0.1。
# nginx 不在本机时，把 proxy_pass 改成对应地址；来源 IP 只信任本机的 nginx，这时审计日志记录的是 nginx 的地址。
# 管理端只开放给局域网时，可以去掉 ssl，改成 listen 192.168.x.x:80，并加上 allow / deny。

# 管理端（默认 127.0.0.1:9443）
server {
    listen 443 ssl;
    server_name panel.example.com;

    ssl_certificate     /etc/nginx/certs/panel.crt;
    ssl_certificate_key /etc/nginx/certs/panel.key;

    # 上传迁移包和依赖安装包，大小不设限。
    client_max_body_size 0;
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:9443;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # 审计日志的来源 IP 和登录 cookie 的 Secure 属性依赖这两个头。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 实时状态、作业进度和日志走 SSE：不能缓冲，连接要能长时间保持。
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}

# 订阅端（默认 127.0.0.1:9444）
server {
    listen 443 ssl;
    server_name sub.example.com;

    ssl_certificate     /etc/nginx/certs/sub.crt;
    ssl_certificate_key /etc/nginx/certs/sub.key;

    location / {
        proxy_pass http://127.0.0.1:9444;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
